    <script>
      // Restores the real path/query/hash if we arrived here via the
      // 404.html GitHub Pages SPA redirect trick. No-op on a normal visit.
      (function () {
        var l = window.location;
        if (l.search[1] === "p" && l.search.slice(1).split("&")[0].slice(2)) {
          var decoded = l.search.slice(1).split("&").reduce(function (acc, cur) {
            var parts = cur.split("=");
            acc[parts[0]] = parts[1].replace(/~and~/g, "&");
            return acc;
          }, {});
          window.history.replaceState(
            null,
            "",
            l.pathname.slice(0, -1) + (decoded.p || "") + (decoded.q ? "?" + decoded.q : "") + l.hash
          );
        }
      })();
    </script>
    <script>
      // Apply saved theme before paint to avoid flash-of-wrong-theme.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <script>
      // Apply saved language before paint (mirrors the theme script above).
      (function () {
        try {
          var lang = localStorage.getItem('lang');
          if (lang === 'en' || lang === 'de') document.documentElement.setAttribute('lang', lang);
        } catch (e) {}
