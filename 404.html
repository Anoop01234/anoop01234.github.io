<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Anoop Gupta</title>
    <!--
      GitHub Pages has no server-side routing, so a direct visit or a
      refresh on a route like /work/some-slug returns this 404 page.
      This script rewrites the URL into a query string and redirects to
      index.html, where the matching inline script (see index.html)
      restores the real path before React Router mounts.
      Technique: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var segmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + segmentsToKeep).join("/") + "/?p=/" +
        l.pathname.slice(1).split("/").slice(segmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&q=" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
